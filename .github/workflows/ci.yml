name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # Fails when a template changed but its gallery preview was not re-rendered (scripts/previews.py).
      - run: node scripts/previews-check.mjs
      # Fails when switching a template's language would change its layout (pages, sections, ornaments).
      - run: node scripts/languages-check.mjs
      # Fails when a name field would pick a dictionary word over the name (Priya -> प्रिय instead of प्रिया).
      - run: node scripts/names-check.mjs
      # Type-checks (tsc -b) and builds exactly as the Pages deploy does.
      - run: npm run build -- --base=./
