name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs: in one job, deploy-pages sometimes looked for the artifact a moment after
  # the upload finished, before it was listed, and failed with "No artifacts named github-pages were found".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Base / (the site is at the domain root): the website pages are served from /websites/..., where relative asset paths would break.
      - run: npm run build
      # Invisible watermark on the artwork and a small mark on card previews, in dist/ only (scripts/protect.py).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install --quiet numpy opencv-python-headless pillow
      - run: python3 scripts/protect.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true # dist/.well-known/tdmrep.json (the AI training opt-out)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the IndexNow step diffs against the previous deploy
      # IndexNow tells Bing (and Yandex, Seznam, Naver) which pages changed, so they are recrawled within days.
      # Only pages changed since the previous deploy are sent (all of them on a manual run).
      # The key is public by design and is served from public/0f579664dcfd107af412065882ffdf85.txt.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          KEY: 0f579664dcfd107af412065882ffdf85
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(grep -o '<loc>[^<]*' public/sitemap.xml | sed 's/<loc>//')
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD -- index.html 'public/*.html' \
              | sed -e 's#^index\.html$#/#' -e 's#^public/##' -e 's#index\.html$##' -e 's#^\([^/]\)#/\1#' \
              | sed 's#^#https://shaaditemplate.com#')
            all=$(grep -Fxf <(echo "$changed") <<< "$all" || true)
          fi
          [ -z "$all" ] && { echo 'No changed pages'; exit 0; }
          urls=$(jq -R . <<< "$all" | jq -cs .)
          curl -sS -o /dev/null -w 'IndexNow %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"shaaditemplate.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://shaaditemplate.com/$KEY.txt\",\"urlList\":$urls}"
